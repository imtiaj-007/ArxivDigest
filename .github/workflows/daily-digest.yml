name: daily-digest

on:
  # 07:00 UTC daily ≈ 12:30 IST. Runs a few hours after arxiv's nightly drop
  # so the late submissions are in. Adjust once V0 ships.
  schedule:
    - cron: "0 7 * * *"

  # Manual trigger for ad-hoc runs + verifying the workflow without waiting for cron.
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false # serialize, don't cancel — partial runs would be confusing

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  digest:
    name: Run daily digest
    runs-on: ubuntu-latest
    # Typical runs land in 14-20 min. 60 leaves ~3x headroom for arxiv 429
    # backoff (up to 5 attempts × 30s), LLM tail latency, and the eval gate.
    # Cap still prevents a runaway loop from burning the full GH Actions budget.
    timeout-minutes: 60
    # Needed for the final step to commit + push `evals/last_report.json` +
    # `evals/metrics/history.jsonl` back to main. Scoped to contents only.
    permissions:
      contents: write
    # Gates all secrets/vars below to the `production` GH environment.
    # In repo Settings → Environments → production, lock to main branch and
    # populate the secrets/vars listed in docs/CI_SECRETS.md.
    environment: production
    defaults:
      run:
        working-directory: apps/agent
    env:
      # --- Secrets (sensitive — values hidden in logs) ---
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # GEMINI_API_KEY intentionally not passed — Gemini free tier is exhausted,
      # so the run goes Groq-only. Re-add to re-enable MultiLLM failover.
      # VOYAGE_API_KEY no longer needed — embeddings are now local (BGE via
      # sentence-transformers). Kept as a secret so re-adding is one-line.
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}

      # --- Variables (non-sensitive — readable in logs) ---
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      SENTRY_DSN: ${{ vars.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: ${{ vars.SENTRY_ENVIRONMENT }}
      APP_ENV: ${{ vars.APP_ENV }}
      LOG_LEVEL: ${{ vars.LOG_LEVEL }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/agent/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --frozen

      # Cache the BGE model weights (~1.3 GB) across runs so the first call to
      # the embedder doesn't re-download from HuggingFace each cron.
      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: hf-models-bge-large-en-v1.5

      - name: Run digest pipeline
        run: uv run arxivdigest run --daily

      # Bust the ISR cache on the data-driven pages so today's digest shows
      # up immediately on the site, not after the page's revalidate interval.
      # No-ops silently if the URL/token aren't set yet (early days).
      - name: Revalidate web pages
        if: success()
        working-directory: .
        env:
          WEB_REVALIDATE_URL: ${{ vars.WEB_REVALIDATE_URL }}
          WEB_REVALIDATE_TOKEN: ${{ secrets.WEB_REVALIDATE_TOKEN }}
        run: |
          if [ -z "$WEB_REVALIDATE_URL" ] || [ -z "$WEB_REVALIDATE_TOKEN" ]; then
            echo "Revalidation URL or token not configured — skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $WEB_REVALIDATE_TOKEN" \
            "$WEB_REVALIDATE_URL"
          echo

      # Re-classify the ground-truth set and fail the workflow if any metric
      # dropped below evals/baseline.json. The eval CLI writes last_report.json
      # + appends history.jsonl BEFORE the baseline check, so even a regression
      # run leaves both artifacts on disk for the next step to persist.
      - name: Eval regression gate
        if: success()
        run: uv run arxivdigest eval --fail-on-regression

      # Persist eval artifacts back to main so they survive the ephemeral
      # runner. `last_report.json` drives the build-time numbers on /about +
      # /docs/evals; `history.jsonl` drives /docs/evals/history. Runs on both
      # success and failure (eval gate exiting non-zero still leaves data
      # worth keeping) but not on cancellation. The [skip ci] tag prevents
      # this bot push from re-triggering CI workflows.
      - name: Persist eval artifacts to main
        if: success() || failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f evals/last_report.json ] && [ ! -f evals/metrics/history.jsonl ]; then
            echo "No eval artifacts on disk — skipping."
            exit 0
          fi
          git config user.name "arxivdigest-bot"
          git config user.email "bot@arxivdigest.local"
          git add evals/last_report.json evals/metrics/history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No eval artifact changes to commit."
            exit 0
          fi
          git commit -m "chore(evals): persist daily-digest eval artifacts [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Pushed eval artifacts on attempt $attempt."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after ${attempt}s..."
            git rebase --abort 2>/dev/null || true
            sleep "$attempt"
          done
          echo "Failed to push eval artifacts after 3 attempts." >&2
          exit 1
